[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zomato-analytics"
version = "1.0.0"
description = "Restaurant-market analytics on the Zomato dataset: cleaning, data quality, SQL marts, statistics and BI-ready outputs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "duckdb>=1.0",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "nbformat>=5", "nbconvert>=7", "ipykernel>=6"]

[project.scripts]
zomato-analytics = "zomato_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks/00_original_colab_eda.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]
